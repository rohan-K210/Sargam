[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sargam-ml"
version = "0.1.0"
description = "Indian Classical Music Swara Recognition Pipeline"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Sargam Team"}]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "librosa>=0.10.2",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "torchcrepe>=0.0.12",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "mir-eval>=0.7",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "flask>=3.0.0",
    "gunicorn>=21.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"